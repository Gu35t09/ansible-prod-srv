# Renovate (renovatebot/renovate, AGPL) on a GitHub runner: it reads
# renovate.json and opens one PR per image update. Nothing runs on the server
# and no personal token is stored anywhere: it uses the job's own GITHUB_TOKEN,
# which expires when the job ends. The repository setting "Allow GitHub
# Actions to create and approve pull requests" must be on.
# The container is started here with docker run, no third-party action: its
# output is kept, so the Telegram step can tell a finished run from an
# interrupted one. The image is in .github/renovate-image, a plain file that
# Renovate can update with a normal PR (it cannot edit this workflow).
# Afterwards a Telegram message lists the new PRs and the updates to do by
# hand (Pending Approval in the Dependency Dashboard), or reports a run that
# did not finish, with the errors Renovate logged.
name: Renovate

on:
  schedule:
    # Saturday 05:00 UTC (06:00 in winter, 07:00 in summer in Italy).
    # GitHub may start scheduled runs some minutes late.
    - cron: "0 5 * * 6"
  workflow_dispatch:

permissions:
  contents: write        # push the update branches
  pull-requests: write   # open and update the PRs
  issues: write          # the Dependency Dashboard issue
  statuses: write        # the "renovate/stability-days" check on update branches;
                         # without it Renovate stops after the first branch

concurrency:
  group: renovate

jobs:
  renovate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Note the start time
        run: echo "RUN_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Run Renovate
        id: renovate
        env:
          GH_TOKEN: ${{ github.token }}
          RENOVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Experimental: a non-zero exit code when the run does not end in
          # "done". The Telegram step reads the result from the log anyway.
          RENOVATE_EXIT_CODE_FOR_ERRORS: "true"
          LOG_LEVEL: info
          LOG_FORMAT: json
        run: |
          set -euo pipefail
          # The image, as committed in the revision this run started from.
          image=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/renovate-image?ref=${GITHUB_SHA}" \
            -H "Accept: application/vnd.github.raw" | tr -d '[:space:]')
          case "$image" in
            ghcr.io/renovatebot/renovate:*) echo "Image: $image" ;;
            *) echo "Unexpected image in .github/renovate-image: $image" >&2; exit 1 ;;
          esac
          # The token goes in by name (--env NAME), never on the command line.
          # The JSON log is kept for the next step and shown one line per message.
          docker run --rm \
            --env RENOVATE_TOKEN --env RENOVATE_REPOSITORIES \
            --env RENOVATE_EXIT_CODE_FOR_ERRORS --env LOG_LEVEL --env LOG_FORMAT \
            "$image" \
            | tee "$RUNNER_TEMP/renovate.log" \
            | jq -rR --unbuffered 'try (fromjson
                | "\((.time // "")[11:19]) \(["", "TRACE", "DEBUG", "INFO", "WARN", "ERROR", "FATAL"][((.level // 30) / 10 | floor)] // "") \(.msg)"
                  + (if .branch then " [\(.branch)]" else "" end)
                  + (if .prTitle then " — \(.prTitle)" else "" end)
                  + (if .result then " result=\(.result)" else "" end))
              catch .'

      - name: Notify Telegram
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not set: no notification."
            exit 0
          fi
          send() {
            curl -sS --fail -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "disable_web_page_preview=true" \
              --data-urlencode "text=$1"
          }
          LOG="$RUNNER_TEMP/renovate.log"
          touch "$LOG"
          # Renovate's own verdict: "done" means the repository was fully processed.
          result=$(jq -rR 'fromjson? | select(.msg == "Repository finished") | .result // empty' "$LOG" | tail -n 1)
          errors=$(jq -rR 'fromjson? | select((.level // 0) >= 50) | "• \(.msg)"' "$LOG" | sort -u | head -n 5)
          if [ "$result" != "done" ]; then
            msg="❌ RENOVATE DID NOT FINISH (${GITHUB_REPOSITORY})
          Result: ${result:-none (it did not start or crashed)}"
            if [ -n "$errors" ]; then
              msg="${msg}

          Errors:
          ${errors}"
            fi
            send "${msg}

          ${RUN_URL}"
            exit 0
          fi
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title,url,headRefName,createdAt)
          open=$(jq '[.[] | select(.headRefName | startswith("renovate/"))] | length' <<<"$prs")
          new=$(jq -r --arg since "$RUN_START" \
            '.[] | select(.headRefName | startswith("renovate/")) | select(.createdAt >= $since) | "• \(.title)\n  \(.url)"' <<<"$prs")
          # Updates Renovate only lists (Postgres majors, the runner image):
          # the "Pending Approval" section of the Dependency Dashboard issue.
          dashboard=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 20 \
            --json title,body --jq '.[] | select(.title == "Dependency Dashboard") | .body' | tr -d '\r')
          pending=$(awk '/^## /{inside = ($0 == "## Pending Approval")} inside && /approve-branch=/' <<<"$dashboard" \
            | sed -e 's/.*-->//' -e 's/^/• /')
          if [ -z "$new" ] && [ -z "$pending" ] && [ -z "$errors" ]; then
            echo "No new PRs, nothing to do by hand, no errors ($open open)."
            exit 0
          fi
          msg="🔄 RENOVATE (${GITHUB_REPOSITORY})"
          if [ -n "$new" ]; then
            msg="${msg}

          New update PRs:
          ${new}

          Read the release notes, merge, then run --tags update-containers."
          fi
          if [ -n "$pending" ]; then
            msg="${msg}

          🛠️ Updates to do by hand (Dependency Dashboard, do not tick the box):
          ${pending}"
          fi
          if [ -n "$errors" ]; then
            msg="${msg}

          ⚠️ Errors logged (the run finished, see the log):
          ${errors}
          ${RUN_URL}"
          fi
          msg="${msg}

          Open Renovate PRs: ${open}."
          send "$msg"
