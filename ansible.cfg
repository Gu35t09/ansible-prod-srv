[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
callback_result_format = yaml
# Run the notified handlers (service restarts) even when a later task fails:
# otherwise a failed run leaves new configuration files on disk that the
# running services never load, and later runs see no change to notify.
force_handlers = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# Pipelining avoids temporary module files on the server; it requires that
# sudo does not enforce requiretty, which is the Debian default.
pipelining = True
