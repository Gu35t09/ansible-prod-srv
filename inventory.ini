# Inventario dei server Alpine Linux
# Sostituisci l'IP con l'indirizzo IP effettivo del tuo server Alpine.
# ansible_user deve coincidere con admin_user (vars/main.yml): è l'unico utente
# autorizzato a doas e ad accedere via SSH (AllowUsers).
[alpine_servers]
alpine-test ansible_host=192.168.18.131 ansible_user=mattia

[all:vars]
ansible_python_interpreter=/usr/bin/python3
