---
# ==============================================================================
# Site-specific settings for the production server.
# Defaults for every other variable live in roles/<role>/defaults/main.yml.
# ==============================================================================

# --- System -------------------------------------------------------------------
server_hostname: "prod-srv-01"
system_timezone: "Europe/Rome"
# Egress is blocked on OPNsense: time comes from the firewall.
ntp_servers:
  - "10.123.11.254"

# --- Administrative user ------------------------------------------------------
# Must match ansible_user in the inventory: it is the only user allowed over SSH
# (AllowUsers) and in sudo. The playbook stops if this list is empty.
# The list is exclusive: keys not listed here are removed from the server.
admin_user: "v"
admin_ssh_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAn6fwLJzRJjFsKK5LVGNTIxrYa9yCg10XO0rQL9JIuw mattia@nixos"
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOLPkoGZUGiYdOW2noZwBttL+WMKoP72KuE2bAm6eNMM mattia.vallortigara@newcomm.it"

# --- Addresses ----------------------------------------------------------------
# Management address: SSH, Ansible, Semaphore.
mgmt_address: "{{ ansible_host }}"
# Services address: Traefik publishes its ports only here.
# Leave empty until the network role has created the services VLAN.
services_address: "10.123.12.11"
# Set to the management address to make sshd listen only there. The hardening
# role refuses any value other than ansible_host.
ssh_listen_address: "10.123.11.11"

# --- Network (applied only with --tags network) ------------------------------
network_parent_interface: "enp1s0"
# One entry per network. vlan: null means untagged on the parent interface.
# Each link gets its own routing table, so replies leave from the VLAN they
# arrived on. Exactly one link must have default_route: true.
network_links:
  - name: VLAN11-Server
    vlan: 11
    address: "10.123.11.11/24"
    gateway: "10.123.11.254"
    table: 100
    default_route: true
  - name: VLAN12-Apps
    vlan: 12
    address: "10.123.12.11/24"
    gateway: "10.123.12.254"
    table: 200
    default_route: false
network_dns_servers:
  - "10.123.11.254"

# --- Notifications ------------------------------------------------------------
telegram_bot_token: "{{ vault_telegram_bot_token }}"
telegram_chat_id: "{{ vault_telegram_chat_id }}"

# --- Traefik --------------------------------------------------------------------
# Wildcard certificate for the domain; the dashboard is proxy.<domain>.
# Point the names to services_address with host overrides in Unbound (OPNsense).
traefik_domain: "greyroom.net"
cloudflare_dns_api_token: "{{ vault_cloudflare_dns_api_token | default('') }}"
traefik_dashboard_users: "{{ vault_traefik_dashboard_users | default([]) }}"
# One entry per service behind Traefik (network proxy-<name>).
traefik_networks:
  - vaultwarden

# --- Backup (restic) -----------------------------------------------------------
# Copy 1: USB disk formatted with this filesystem label (see the README).
backup_usb_label: "backup-usb"
# Copy 2: S3 bucket. Allow the endpoint on OPNsense. Turn on object lock or
# versioning on the bucket, so a compromised server cannot erase the history.
backup_s3_endpoint: "885965159e7b78dc7d102242522e9ba7.eu.r2.cloudflarestorage.com"
backup_s3_bucket: "backups"
restic_password: "{{ vault_restic_password | default('') }}"
backup_s3_access_key: "{{ vault_backup_s3_access_key | default('') }}"
backup_s3_secret_key: "{{ vault_backup_s3_secret_key | default('') }}"
