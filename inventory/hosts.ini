# Production server inventory.
# ansible_host must be the server's management IP: SSH listens only there once
# ssh_listen_address is set, and the network role checks it before rebooting.
# ansible_user must match admin_user (group_vars): it is the only user allowed
# to log in over SSH and to use sudo.
[prod_servers]
prod-srv ansible_host=10.0.10.10 ansible_user=mattia
