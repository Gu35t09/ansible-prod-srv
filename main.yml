---
# ==============================================================================
# PLAYBOOK PRINCIPALE PER CONFIGURAZIONE E MANUTENZIONE ALPINE LINUX
# ==============================================================================
# Uso con Semaphore / CLI:
# - Esecuzione completa (Setup iniziale, Hardening, Docker, ClamAV):
#     ansible-playbook -i inventory.ini main.yml
# - Esecuzione solo aggiornamenti di sistema (per Job periodico Semaphore):
#     ansible-playbook -i inventory.ini main.yml --tags update
# ==============================================================================

- name: Configuratore e Manutentore Alpine Server
  hosts: alpine_servers
  gather_facts: true
  vars_files:
    - vars/main.yml

  tasks:
    - name: Inizio configurazione di base ed aggiornamenti
      ansible.builtin.include_tasks: tasks/setup.yaml
      tags:
        - setup
        - base

    - name: Hardening del sistema, Doas e SSH
      ansible.builtin.include_tasks: tasks/hardening.yaml
      tags:
        - hardening
        - security
        - ssh

    - name: Installazione e configurazione Docker Rootless
      ansible.builtin.include_tasks: tasks/docker.yaml
      tags:
        - docker

    - name: Installazione, configurazione ClamAV e notifiche Telegram
      ansible.builtin.include_tasks: tasks/clamav.yaml
      tags:
        - clamav
        - antivirus

    - name: Aggiornamento del sistema e dei pacchetti
      ansible.builtin.include_tasks: tasks/update.yaml
      tags:
        - update
        - maintenance
