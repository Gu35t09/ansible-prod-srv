---
# Rootless Docker publishes ports through rootlesskit, a userspace process:
# containers never touch the host's nftables rules, so the input chain below
# filters published ports too and forwarding stays disabled.

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Write the nftables ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0600"
    validate: nft -c -f %s
  notify: Apply nftables ruleset

- name: Enable nftables at boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
