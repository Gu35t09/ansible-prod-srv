---
# SMART monitoring is skipped on virtual machines (no physical disk to read).
smartd_enabled: "{{ ansible_facts['virtualization_role'] | default('') != 'guest' }}"
# Short self-test daily at 02:00, long self-test on Saturdays at 03:00.
smartd_self_tests: "(S/../.././02|L/../../6/03)"
# Temperature: report changes of 4 °C, info at 45 °C, alert at 55 °C.
smartd_temperature: "4,45,55"

disk_space_mountpoints:
  - /
disk_space_warn_percent: 85
disk_space_check_on_calendar: "*:0/15"
