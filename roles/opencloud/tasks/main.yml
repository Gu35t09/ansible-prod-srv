---
# OpenCloud (file sync and share) with its built-in user directory and PosixFS
# storage: files are kept on disk as the user sees them, metadata in extended
# attributes, no database. The container joins only proxy-opencloud. It
# reaches its own public URL (login checks) through a Traefik alias on that
# network, so it needs no route to the Internet.

- name: Check the OpenCloud settings
  ansible.builtin.assert:
    that:
      - traefik_domain | default('') | length > 0
      - "'opencloud' in traefik_networks | default([])"
      - opencloud_host in (traefik_network_aliases | default({})).get('opencloud', [])
      - opencloud_admin_password | length >= 16
    fail_msg: >-
      Set traefik_domain; add opencloud to traefik_networks and
      traefik_network_aliases (opencloud: ["{{ opencloud_host }}"]) in main.yml
      and run --tags traefik first; set vault_opencloud_admin_password (at
      least 16 characters).
    quiet: true

- name: Look up the Docker service user
  ansible.builtin.getent:
    database: passwd
    key: "{{ docker_user }}"
    fail_key: false

- name: Check that rootless Docker is configured
  ansible.builtin.assert:
    that:
      - ansible_facts['getent_passwd'][docker_user] is not none
    fail_msg: "{{ docker_user }} does not exist: run the playbook with --tags docker first."
    quiet: true

- name: Check that Traefik is configured
  ansible.builtin.stat:
    path: "{{ opencloud_traefik_dynamic_dir }}"
  register: opencloud_traefik_dir

- name: Stop if Traefik is missing
  ansible.builtin.assert:
    that:
      - opencloud_traefik_dir.stat.isdir | default(false)
    fail_msg: "{{ opencloud_traefik_dynamic_dir }} does not exist: run the playbook with --tags traefik first."
    quiet: true

- name: Create the OpenCloud directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ docker_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ opencloud_dir }}", owner: root, mode: "0750" }
    # opencloud.yaml with the generated secrets (written at the first start).
    - { path: "{{ opencloud_dir }}/config", owner: "{{ docker_user }}", mode: "0700" }
    # Users' files (storage/users), the user directory, search index, thumbnails.
    - { path: "{{ opencloud_dir }}/data", owner: "{{ docker_user }}", mode: "0700" }
    - { path: "{{ opencloud_dir }}/secrets", owner: "{{ docker_user }}", mode: "0700" }

- name: Write the initial admin password
  ansible.builtin.copy:
    dest: "{{ opencloud_dir }}/secrets/admin.env"
    content: |
      IDM_ADMIN_PASSWORD={{ opencloud_admin_password }}
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0600"
  no_log: true

# OpenCloud's backup guide: stop it for a consistent copy. The backup runs
# pre.d before and post.d after both copies.
- name: Install the backup hooks
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0750"
  loop:
    - { src: backup-stop.sh.j2, dest: /etc/backup/pre.d/opencloud }
    - { src: backup-start.sh.j2, dest: /etc/backup/post.d/opencloud }

- name: Write the compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ opencloud_dir }}/compose.yml"
    owner: root
    group: "{{ docker_user }}"
    mode: "0640"

- name: Start OpenCloud
  ansible.builtin.command:
    cmd: docker compose --file {{ opencloud_dir }}/compose.yml up --detach --remove-orphans --wait
    chdir: "{{ opencloud_dir }}"
  become: true
  become_user: "{{ docker_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][docker_user][1] }}"
    DOCKER_HOST: "unix:///run/user/{{ ansible_facts['getent_passwd'][docker_user][1] }}/docker.sock"
  register: opencloud_up
  changed_when: opencloud_up.stderr is search('Creat|Recreat|Start')

# After the container is up, so Traefik never routes to a missing service.
- name: Write the Traefik route
  ansible.builtin.template:
    src: traefik-route.yml.j2
    dest: "{{ opencloud_traefik_dynamic_dir }}/opencloud.yml"
    owner: root
    group: "{{ docker_user }}"
    mode: "0640"
