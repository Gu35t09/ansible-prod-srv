---
# Pinned by tag and digest: an update is a change in this file (Renovate),
# applied with --tags update-containers.
traefik_image: "docker.io/library/traefik:v3.7.17@sha256:f4bb143d1135a579b630ed491e17ec50f6f7c9c6a30585ff3d385471d2a86f5a"

docker_user: "svc-docker"
traefik_dir: /srv/docker/system/traefik
# traefik.log and access.log in <traefik_dir>/logs, rotated daily by
# logrotate; kept this many days (and in the nightly backup, under /srv).
traefik_log_retention_days: 30

# One wildcard certificate for the domain and its first-level subdomains.
# Every service gets <name>.<traefik_domain>; the internal names never show
# up in the public Certificate Transparency logs.
traefik_domain: ""
traefik_dashboard_host: "proxy.{{ traefik_domain }}"
# htpasswd lines with bcrypt hashes ("user:$2y$..."), from the vault.
traefik_dashboard_users: []

# Services Traefik routes to. Each gets its own internal network,
# proxy-<name>, shared only by Traefik and that service: services never
# reach each other through Traefik's networks. Add a name here (main.yml)
# before deploying the service.
traefik_networks: []
# Host names Traefik answers to on a service's own network, per service:
#   opencloud: ["cloud.example.org"]
# For services that must reach their own public URL from inside.
traefik_network_aliases: {}

# Address the ports are published on. Empty: every address (before the
# services VLAN exists).
traefik_bind_address: "{{ services_address | default('') }}"

# Let's Encrypt with the Cloudflare DNS challenge. The token needs
# Zone / Zone / Read and Zone / DNS / Edit, on this zone only.
cloudflare_dns_api_token: ""
# Optional: Let's Encrypt account e-mail.
traefik_acme_email: ""
# For tests, the staging CA avoids the production rate limits:
#   https://acme-staging-v02.api.letsencrypt.org/directory
traefik_acme_ca_server: "https://acme-v02.api.letsencrypt.org/directory"
# Resolvers for the propagation check. With egress filtered, the authoritative
# Cloudflare name servers are unreachable, so only these are asked.
traefik_acme_resolvers: "{{ network_dns_servers | default([]) | map('regex_replace', '$', ':53') | list }}"
