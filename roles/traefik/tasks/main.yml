---
# Traefik in front of every container service. Routes come only from files in
# <traefik_dir>/dynamic/ (one per service, written by its role): Traefik gets
# no access to the Docker socket, which would mean control of every container.

- name: Check the Traefik settings
  ansible.builtin.assert:
    that:
      - traefik_domain | length > 0
      - cloudflare_dns_api_token | length > 0
      - traefik_dashboard_users | length > 0
    fail_msg: >-
      Set traefik_domain, and in the vault vault_cloudflare_dns_api_token and
      vault_traefik_dashboard_users (see the README, "Traefik").
    quiet: true

- name: Look up the Docker service user
  ansible.builtin.getent:
    database: passwd
    key: "{{ docker_user }}"
    fail_key: false

- name: Check that rootless Docker is configured
  ansible.builtin.assert:
    that:
      - ansible_facts['getent_passwd'][docker_user] is not none
    fail_msg: "{{ docker_user }} does not exist: run the playbook with --tags docker first."
    quiet: true

- name: Check the service network names
  ansible.builtin.assert:
    that:
      - traefik_networks | select('match', '^[a-z0-9][a-z0-9_-]*$') | list | length == traefik_networks | length
      - traefik_networks | unique | length == traefik_networks | length
    fail_msg: "traefik_networks: lowercase names (letters, digits, - and _), each listed once."
    quiet: true

- name: Create the Traefik directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ docker_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ traefik_dir }}", owner: root, mode: "0750" }
    - { path: "{{ traefik_dir }}/dynamic", owner: root, mode: "0750" }
    # Certificates (acme.json) and the Cloudflare token: the service user only.
    - { path: "{{ traefik_dir }}/data", owner: "{{ docker_user }}", mode: "0700" }
    - { path: "{{ traefik_dir }}/logs", owner: "{{ docker_user }}", mode: "0750" }

# copytruncate: Traefik keeps writing to the same file, no signal needed.
- name: Rotate the Traefik logs
  ansible.builtin.template:
    src: logrotate.j2
    dest: /etc/logrotate.d/traefik
    owner: root
    group: root
    mode: "0644"

- name: Write the Cloudflare token
  ansible.builtin.copy:
    dest: "{{ traefik_dir }}/data/cloudflare-dns-api-token"
    content: "{{ cloudflare_dns_api_token }}"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0600"
  no_log: true
  notify: Restart Traefik

- name: Write the static configuration
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_dir }}/traefik.yml"
    owner: root
    group: "{{ docker_user }}"
    mode: "0640"
  notify: Restart Traefik

# Traefik watches this directory: changes apply without a restart.
- name: Write the dashboard route, middlewares and TLS options
  ansible.builtin.template:
    src: dynamic-traefik.yml.j2
    dest: "{{ traefik_dir }}/dynamic/traefik.yml"
    owner: root
    group: "{{ docker_user }}"
    mode: "0640"

- name: Write the compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ traefik_dir }}/compose.yml"
    owner: root
    group: "{{ docker_user }}"
    mode: "0640"

- name: List the Docker networks
  ansible.builtin.command:
    cmd: docker network ls --format '{{ "{{" }}.Name{{ "}}" }}'
  become: true
  become_user: "{{ docker_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][docker_user][1] }}"
    DOCKER_HOST: "unix:///run/user/{{ ansible_facts['getent_passwd'][docker_user][1] }}/docker.sock"
  register: traefik_existing_networks
  changed_when: false

# Created here, not by compose: they must exist before Traefik and the
# service start, and outlive either being recreated. --internal: no route to
# the Internet through them; Traefik reaches Let's Encrypt and Cloudflare on
# its own default network.
- name: Create one internal network per service
  ansible.builtin.command:
    cmd: docker network create --internal --label managed-by=ansible {{ item }}
  become: true
  become_user: "{{ docker_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][docker_user][1] }}"
    DOCKER_HOST: "unix:///run/user/{{ ansible_facts['getent_passwd'][docker_user][1] }}/docker.sock"
  loop: "{{ traefik_networks | map('regex_replace', '^', 'proxy-') | reject('in', traefik_existing_networks.stdout_lines) | list }}"
  changed_when: true

- name: Start Traefik
  ansible.builtin.command:
    cmd: docker compose --file {{ traefik_dir }}/compose.yml up --detach --remove-orphans --wait
    chdir: "{{ traefik_dir }}"
  become: true
  become_user: "{{ docker_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][docker_user][1] }}"
    DOCKER_HOST: "unix:///run/user/{{ ansible_facts['getent_passwd'][docker_user][1] }}/docker.sock"
  register: traefik_up
  changed_when: traefik_up.stderr is search('Creat|Recreat|Start')
