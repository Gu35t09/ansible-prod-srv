---
# Uptime Kuma behind Traefik, with SQLite. It checks the services through
# Traefik, on its network proxy-uptime-kuma where Traefik answers to every
# service's host name (traefik_network_aliases), and sends its alerts to
# Telegram through its own network with Internet access. The monitors and
# the notifications are set up in its web interface and kept in its database.

- name: Check the Uptime Kuma settings
  ansible.builtin.assert:
    that:
      - traefik_domain | default('') | length > 0
      - "'uptime-kuma' in traefik_networks | default([])"
    fail_msg: >-
      Set traefik_domain, and add uptime-kuma to traefik_networks (and its
      aliases to traefik_network_aliases) in main.yml, then run --tags traefik
      before this role (it creates proxy-uptime-kuma).
    quiet: true

- name: Look up the Docker service user
  ansible.builtin.getent:
    database: passwd
    key: "{{ docker_user }}"
    fail_key: false

- name: Check that rootless Docker is configured
  ansible.builtin.assert:
    that:
      - ansible_facts['getent_passwd'][docker_user] is not none
    fail_msg: "{{ docker_user }} does not exist: run the playbook with --tags docker first."
    quiet: true

- name: Check that Traefik is configured
  ansible.builtin.stat:
    path: "{{ uptime_kuma_traefik_dynamic_dir }}"
  register: uptime_kuma_traefik_dir

- name: Stop if Traefik is missing
  ansible.builtin.assert:
    that:
      - uptime_kuma_traefik_dir.stat.isdir | default(false)
    fail_msg: "{{ uptime_kuma_traefik_dynamic_dir }} does not exist: run the playbook with --tags traefik first."
    quiet: true

# Uptime Kuma runs as its image's own user, UID/GID 1000 inside the
# container: on the host, the service user's subordinate ID start + 999.
- name: Read the service user's subordinate ID ranges
  ansible.builtin.command:
    argv:
      - awk
      - "-F:"
      - "-v"
      - "user={{ docker_user }}"
      - "$1 == user { print $2; exit }"
      - "{{ item }}"
  loop:
    - /etc/subuid
    - /etc/subgid
  register: uptime_kuma_subid
  changed_when: false

- name: Check the subordinate ID ranges
  ansible.builtin.assert:
    that:
      - uptime_kuma_subid.results[0].stdout is match('^[0-9]+$')
      - uptime_kuma_subid.results[1].stdout is match('^[0-9]+$')
    fail_msg: "{{ docker_user }} has no range in /etc/subuid or /etc/subgid: rootless Docker would not work either."
    quiet: true

- name: Compute the host IDs of the container's UID 1000
  ansible.builtin.set_fact:
    uptime_kuma_host_uid: "{{ uptime_kuma_subid.results[0].stdout | int + 999 }}"
    uptime_kuma_host_gid: "{{ uptime_kuma_subid.results[1].stdout | int + 999 }}"

- name: Create the Uptime Kuma directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ uptime_kuma_dir }}", owner: root, group: "{{ docker_user }}", mode: "0750" }
    # The database (monitors, notifications, history) and the uploads.
    - { path: "{{ uptime_kuma_dir }}/data", owner: "{{ uptime_kuma_host_uid }}", group: "{{ uptime_kuma_host_gid }}", mode: "0750" }
    # Written by sqlite3 inside the container, as UID 1000.
    - { path: "{{ uptime_kuma_dir }}/dump", owner: "{{ uptime_kuma_host_uid }}", group: "{{ uptime_kuma_host_gid }}", mode: "0700" }

# Run by the backup before each run (run-parts: no dot in the name).
- name: Install the database dump script
  ansible.builtin.template:
    src: dump.sh.j2
    dest: /etc/backup/pre.d/uptime-kuma
    owner: root
    group: root
    mode: "0750"

- name: Write the compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ uptime_kuma_dir }}/compose.yml"
    owner: root
    group: "{{ docker_user }}"
    mode: "0640"

- name: Start Uptime Kuma
  ansible.builtin.command:
    cmd: docker compose --file {{ uptime_kuma_dir }}/compose.yml up --detach --remove-orphans --wait
    chdir: "{{ uptime_kuma_dir }}"
  become: true
  become_user: "{{ docker_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][docker_user][1] }}"
    DOCKER_HOST: "unix:///run/user/{{ ansible_facts['getent_passwd'][docker_user][1] }}/docker.sock"
  register: uptime_kuma_up
  changed_when: uptime_kuma_up.stderr is search('Creat|Recreat|Start')

# After the container is up, so Traefik never routes to a missing service.
# Traefik watches the directory: no restart needed.
- name: Write the Traefik route
  ansible.builtin.template:
    src: traefik-route.yml.j2
    dest: "{{ uptime_kuma_traefik_dynamic_dir }}/uptime-kuma.yml"
    owner: root
    group: "{{ docker_user }}"
    mode: "0640"
