---
# Vaultwarden behind Traefik, with SQLite. The container joins only its
# internal network proxy-vaultwarden: it is reachable from Traefik alone and
# has no route to the Internet.

- name: Check the Vaultwarden settings
  ansible.builtin.assert:
    that:
      - traefik_domain | default('') | length > 0
      - "'vaultwarden' in traefik_networks | default([])"
    fail_msg: >-
      Set traefik_domain, and add vaultwarden to traefik_networks in main.yml,
      then run --tags traefik before this role (it creates proxy-vaultwarden).
    quiet: true

- name: Look up the Docker service user
  ansible.builtin.getent:
    database: passwd
    key: "{{ docker_user }}"
    fail_key: false

- name: Check that rootless Docker is configured
  ansible.builtin.assert:
    that:
      - ansible_facts['getent_passwd'][docker_user] is not none
    fail_msg: "{{ docker_user }} does not exist: run the playbook with --tags docker first."
    quiet: true

- name: Check that Traefik is configured
  ansible.builtin.stat:
    path: "{{ vaultwarden_traefik_dynamic_dir }}"
  register: vaultwarden_traefik_dir

- name: Stop if Traefik is missing
  ansible.builtin.assert:
    that:
      - vaultwarden_traefik_dir.stat.isdir | default(false)
    fail_msg: "{{ vaultwarden_traefik_dynamic_dir }} does not exist: run the playbook with --tags traefik first."
    quiet: true

# For the dump script: the container image has no sqlite3.
- name: Install sqlite3
  ansible.builtin.apt:
    name: sqlite3
    state: present

- name: Create the Vaultwarden directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ docker_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ vaultwarden_dir }}", owner: root, mode: "0750" }
    # The vault database, the attachments and the server key.
    - { path: "{{ vaultwarden_dir }}/data", owner: "{{ docker_user }}", mode: "0700" }
    - { path: "{{ vaultwarden_dir }}/dump", owner: "{{ docker_user }}", mode: "0700" }
    - { path: "{{ vaultwarden_dir }}/logs", owner: "{{ docker_user }}", mode: "0750" }

- name: Rotate the Vaultwarden log
  ansible.builtin.template:
    src: logrotate.j2
    dest: /etc/logrotate.d/vaultwarden
    owner: root
    group: root
    mode: "0644"

# Run by the backup before each run (run-parts: no dot in the name).
- name: Install the database dump script
  ansible.builtin.template:
    src: dump.sh.j2
    dest: /etc/backup/pre.d/vaultwarden
    owner: root
    group: root
    mode: "0750"

- name: Write the compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ vaultwarden_dir }}/compose.yml"
    owner: root
    group: "{{ docker_user }}"
    mode: "0640"

- name: Start Vaultwarden
  ansible.builtin.command:
    cmd: docker compose --file {{ vaultwarden_dir }}/compose.yml up --detach --remove-orphans --wait
    chdir: "{{ vaultwarden_dir }}"
  become: true
  become_user: "{{ docker_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][docker_user][1] }}"
    DOCKER_HOST: "unix:///run/user/{{ ansible_facts['getent_passwd'][docker_user][1] }}/docker.sock"
  register: vaultwarden_up
  changed_when: vaultwarden_up.stderr is search('Creat|Recreat|Start')

# After the container is up, so Traefik never routes to a missing service.
# Traefik watches the directory: no restart needed.
- name: Write the Traefik route
  ansible.builtin.template:
    src: traefik-route.yml.j2
    dest: "{{ vaultwarden_traefik_dynamic_dir }}/vaultwarden.yml"
    owner: root
    group: "{{ docker_user }}"
    mode: "0640"
