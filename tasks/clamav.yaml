---
# ==============================================================================
# TASK: INSTALLAZIONE E CONFIGURAZIONE CLAMAV, CLAMD ED AGGIORNATORE FRESHCLAM
# ==============================================================================

- name: Verificare che la quarantena sia fuori dai percorsi scansionati
  ansible.builtin.assert:
    that:
      - not ((clamav_quarantine_dir ~ '/').startswith(item.rstrip('/') ~ '/'))
    fail_msg: >-
      clamav_quarantine_dir ({{ clamav_quarantine_dir }}) è dentro il percorso
      scansionato {{ item }}: i file in quarantena verrebbero rilevati ad ogni scansione.
    quiet: true
  loop: "{{ clamav_scan_paths }}"

- name: Installare ClamAV, demone Clamd, Freshclam e dipendenze
  community.general.apk:
    name:
      - clamav
      - clamav-daemon
      - clamav-libunrar
      - freshclam
      - curl
    state: present

- name: Assicurarsi che le directory di log e runtime per ClamAV esistano con i permessi corretti
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: clamav
    group: clamav
    mode: '0755'
  loop:
    - /var/log/clamav
    - /var/lib/clamav
    - /run/clamav

- name: Creare la directory di quarantena (accessibile solo a root)
  ansible.builtin.file:
    path: "{{ clamav_quarantine_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

# Eseguito solo se il database firme non esiste ancora: clamd non parte senza.
- name: Scaricare il database delle firme con freshclam (primo avvio)
  ansible.builtin.command:
    cmd: freshclam
    creates: /var/lib/clamav/daily.c[lv]d
  register: freshclam_init
  until: freshclam_init.rc == 0
  retries: 3
  delay: 30

- name: Abilitare ed avviare il servizio del demone freshclam (aggiornamento automatico firme)
  ansible.builtin.service:
    name: freshclam
    enabled: true
    state: started

- name: Abilitare ed avviare il servizio del demone ClamAV (clamd)
  ansible.builtin.service:
    name: clamd
    enabled: true
    state: started

# Contiene il token Telegram: leggibile ed eseguibile solo da root.
- name: Creare lo script di scansione ClamAV con notifiche Telegram da template J2
  ansible.builtin.template:
    src: templates/clamav_scan_telegram.sh.j2
    dest: /usr/local/bin/clamav_scan_telegram.sh
    owner: root
    group: root
    mode: '0700'

# Alpine usa il crond di busybox: va abilitato, altrimenti il job non parte mai.
- name: Abilitare ed avviare il demone cron
  ansible.builtin.service:
    name: crond
    enabled: true
    state: started

- name: Configurare il Cron job per la scansione schedulata con notifiche Telegram
  ansible.builtin.cron:
    name: "Scansione periodica ClamAV con notifiche Telegram"
    minute: "{{ clamav_scan_schedule_cron.split(' ')[0] }}"
    hour: "{{ clamav_scan_schedule_cron.split(' ')[1] }}"
    day: "{{ clamav_scan_schedule_cron.split(' ')[2] }}"
    month: "{{ clamav_scan_schedule_cron.split(' ')[3] }}"
    weekday: "{{ clamav_scan_schedule_cron.split(' ')[4] }}"
    job: "/usr/local/bin/clamav_scan_telegram.sh > /dev/null 2>&1"
    state: "{{ 'present' if clamav_enabled else 'absent' }}"
