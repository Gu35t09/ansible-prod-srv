---
# ==============================================================================
# TASK: CONFIGURAZIONE INIZIALE E PACCHETTI BASE (Alpine Linux)
# ==============================================================================

- name: Assicurarsi che il repository community di Alpine sia abilitato
  ansible.builtin.lineinfile:
    path: /etc/apk/repositories
    regexp: '^#?\s*(http.*/v\d+\.\d+/community)$'
    line: '\1'
    backrefs: true

- name: Aggiornare l'indice dei pacchetti apk
  community.general.apk:
    update_cache: true

- name: Installare i pacchetti base di sistema essenziali
  community.general.apk:
    name:
      - ca-certificates
      - curl
      - wget
      - bash
      - doas
      - tzdata
      - htop
      - nano
      - logrotate
      - python3
    state: present

- name: Impostare il fuso orario di sistema
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ system_timezone }}"
    dest: /etc/localtime
    state: link
    force: true
